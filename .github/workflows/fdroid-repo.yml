name: F-Droid repo

on:
  workflow_run:
    workflows: ['Build APK']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  fdroid-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release APK (auto)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: incoming
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download APK (manual, fallback debug)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/build-apk.yml/runs?per_page=1&status=success" --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/build-debug.yml/runs?per_page=1&status=success" --jq '.workflow_runs[0].id // empty')
            gh run download "$RUN_ID" -n apk-debug -D incoming
          else
            gh run download "$RUN_ID" -n apk -D incoming
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: |
          pip install --upgrade pip
          pip install fdroidserver

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools (direct download)
        run: |
          mkdir -p /opt/android
          curl -fsSL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q /tmp/bt.zip -d /opt/android/build-tools-raw
          mkdir -p /opt/android/build-tools/34.0.0
          cp -r /opt/android/build-tools-raw/*/* /opt/android/build-tools/34.0.0/ 2>/dev/null || cp -r /opt/android/build-tools-raw/* /opt/android/build-tools/34.0.0/
          chmod +x /opt/android/build-tools/34.0.0/* 2>/dev/null || true
          ls -la /opt/android/build-tools/34.0.0/
          echo "/opt/android/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=/opt/android" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/opt/android" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > fdroid_keystore.p12

      - name: Prepare fdroid dir
        run: |
          mkdir -p fdroid/repo fdroid/metadata
          cp incoming/*.apk fdroid/repo/
          mv fdroid_keystore.p12 fdroid/keystore.p12
          cat > fdroid/config.yml <<'EOF'
          repo_url: https://jonayooficial.github.io/jonayodownloader-android/repo
          repo_name: Jonayo Downloader
          repo_description: Descargas y streaming de videos y musica (YouTube)
          repo_keyalias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keystore: keystore.p12
          keystorepass: ${{ secrets.RELEASE_STORE_PASS }}
          keypass: ${{ secrets.RELEASE_STORE_PASS }}
          keydname: CN=Jonayo Downloader, O=Jonayo, C=MX
          archive_older: 0
          EOF
          chmod 600 fdroid/config.yml
          cat > fdroid/metadata/org.jonayo.jonayodownloader.yml <<'EOF2'
          Categories:
            - Multimedia
          License: Unknown
          AuthorName: Jonayo
          AutoName: Jonayo Downloader
          Summary: Descarga y streaming de videos y musica
          Description: |-
            App para descargar videos y musica de YouTube y ver streaming
            tipo reproductor.
          RepoType: srclib
          Repo: .
          CurrentVersion: 1.8.9
          CurrentVersionCode: 102410809
          EOF2

      - name: Update F-Droid index
        run: |
          cd fdroid
          fdroid update --create-metadata --pretty

      - name: List output
        run: |
          ls -la fdroid/repo/

      - name: Stage for Pages (/repo/)
        run: |
          mkdir -p site/repo
          cp -r fdroid/repo/. site/repo/
          ls -la site/repo/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4